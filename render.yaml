services:
  - type: web
    name: connectify-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://client-five-lake-22.vercel.app,http://localhost:5173
      - key: DATABASE_URL
        sync: false
